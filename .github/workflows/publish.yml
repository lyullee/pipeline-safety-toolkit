name: publish-pypi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require a release tag matching project metadata
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF'] == 'refs/tags/v' + version, 'Publish the reviewed version tag'
      - run: python -m pip install build twine ruff
      - run: python -m ruff check src tests scripts examples --select E9,F821,F822,F823
      - run: python scripts/check_publication_boundaries.py
      - run: python -m build --wheel
      - run: python scripts/check_isolated_core.py
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - run: python scripts/audit_release.py --check-consistency
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pipeline-safety-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
